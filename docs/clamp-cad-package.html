<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
function b64bytes(s){const bin=atob(s),n=bin.length,a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=bin.charCodeAt(i);return a;}
(async()=>{
  const status=document.getElementById('status'),wrap=document.getElementById('pages');
  try{
    const data=b64bytes(document.getElementById('pdf-b64').textContent.trim());
    const pdf=await pdfjsLib.getDocument({data}).promise;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const cssW=Math.min(1000,(window.innerWidth||1000)-32);
    status.remove();
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const vp1=page.getViewport({scale:1});
      const vp=page.getViewport({scale:(cssW*dpr)/vp1.width});
      const c=document.createElement('canvas');
      c.width=Math.round(vp.width);c.height=Math.round(vp.height);
      wrap.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){status.textContent='Could not load document: '+e.message;wrap.before(status);}
})();
</script>
